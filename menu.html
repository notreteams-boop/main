<!DOCTYPE html>
<html lang="lv">
<head>
<!-- !! DROŠĪBA: auth.js — OBLIGĀTI PIRMĀ RINDA !! -->
<script src="/main/auth.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tēmu izvēle · OL Mat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS & RESET
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:    #07010f;
  --bg2:   #161820;
  --bg3:   #1e2028;
  --bg4:   #232635;
  --bd:    rgba(255,255,255,0.07);
  --a:     #bfff00;
  --a-dim: rgba(191,255,0,0.09);
  --a-glo: rgba(191,255,0,0.28);
  --a-brd: rgba(191,255,0,0.26);
  --tx:    #e8eaf0;
  --mu:    rgba(232,234,240,0.44);
  --or:    #ff8800;
  --re:    #ff3b3b;
  --r:     12px;
  --r2:    16px;
}
html{scroll-behavior:smooth;}
body{
  color:var(--tx);
  font-family:'Rajdhani',sans-serif;font-size:16px;
  min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 2% -5%,  rgba(200,20,255,0.09),  transparent),
    radial-gradient(ellipse 60% 50% at 98% 102%, rgba(15,60,255,0.08),  transparent),
    linear-gradient(175deg, #21093B 0%, #100320 45%, #07010f 100%);
  background-attachment:fixed;
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--a-brd);}

/* ═══════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════ */
header{
  position:sticky;top:0;z-index:200;
  height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;gap:12px;
  background:rgba(20,5,40,0.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--a-brd);
}
.h-logo{
  font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;
  letter-spacing:3px;color:var(--a);
  text-shadow:0 0 14px var(--a-glo);
  flex-shrink:0;
}
.h-logo em{color:rgba(255,255,255,0.25);font-style:normal;}
.h-mid{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;}

/* ── Streak badge ── */
.streak{
  display:flex;align-items:center;gap:5px;
  padding:5px 13px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:100px;
  user-select:none;cursor:default;white-space:nowrap;
}
.s-fire{font-size:1.05rem;line-height:1;transition:filter .35s,opacity .35s;}
.s-fire.on {filter:drop-shadow(0 0 7px #ff8800);}
.s-fire.off{filter:grayscale(1) brightness(0.6);opacity:.35;}
.s-num{
  font-family:'Orbitron',monospace;font-size:0.75rem;font-weight:700;
  color:var(--tx);min-width:1ch;
}

/* ── Lang switcher ── */
.lsw{
  display:flex;background:var(--bg2);
  border:1px solid var(--bd);border-radius:100px;padding:3px;gap:2px;
}
.lbtn{
  padding:4px 10px;min-height:28px;
  background:transparent;border:none;border-radius:100px;
  font-family:'Rajdhani',sans-serif;font-size:0.72rem;font-weight:700;
  letter-spacing:.3px;color:var(--mu);cursor:pointer;transition:all .2s;
}
.lbtn.on{background:var(--a);color:#000;}

/* ── Back button ── */
.btn-back{
  display:flex;align-items:center;gap:5px;
  padding:7px 15px;min-height:36px;
  background:transparent;border:1px solid var(--a-brd);border-radius:100px;
  font-family:'Rajdhani',sans-serif;font-size:0.8rem;font-weight:700;
  color:var(--a);text-decoration:none;white-space:nowrap;
  transition:all .2s;flex-shrink:0;
}
.btn-back:hover{background:var(--a);color:#000;}
@media(max-width:540px){
  .btn-back .btn-lbl{display:none;}
  .h-logo{font-size:.85rem;}
}

/* ═══════════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════════ */
.page{max-width:1160px;margin:0 auto;padding:0 18px 72px;}

/* ═══════════════════════════════════════════════════════════════
   HERO + SCORE SLIDER
   ═══════════════════════════════════════════════════════════════ */
.hero{padding:32px 0 20px;text-align:center;}
.hero-eye{
  font-size:.68rem;letter-spacing:2.5px;color:var(--a);
  font-weight:700;text-transform:uppercase;margin-bottom:7px;
  font-family:'Share Tech Mono',monospace;
}
.hero-h{
  font-family:'Orbitron',monospace;
  font-size:clamp(1.35rem,4.5vw,2rem);font-weight:900;
  letter-spacing:1px;line-height:1.22;margin-bottom:26px;
}
.hero-h em{color:var(--a);font-style:normal;text-shadow:0 0 18px var(--a-glo);}

/* Score widget */
.score-box{
  max-width:440px;margin:0 auto;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:20px 22px;
}
.score-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.score-lbl{font-size:.8rem;color:var(--mu);font-weight:600;letter-spacing:.2px;}
.score-val{
  font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;
  color:var(--a);text-shadow:0 0 20px var(--a-glo);line-height:1;
}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:5px;border-radius:100px;cursor:pointer;outline:none;
  background:linear-gradient(to right,var(--a) var(--p,50%),var(--bg3) var(--p,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:var(--a);border:3px solid var(--bg);
  box-shadow:0 0 10px var(--a-glo);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:var(--a);border:3px solid var(--bg);
  box-shadow:0 0 10px var(--a-glo);cursor:pointer;
}
.score-hint{font-size:.74rem;color:var(--mu);margin-top:9px;text-align:center;}

/* ═══════════════════════════════════════════════════════════════
   DAILY GOAL
   ═══════════════════════════════════════════════════════════════ */
.daily{
  margin:16px 0;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:16px 20px;
}
.daily-top{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;flex-wrap:wrap;gap:6px;
}
.daily-lbl{
  font-family:'Share Tech Mono',monospace;font-size:.7rem;
  letter-spacing:2px;color:var(--a);font-weight:700;
}
.daily-cnt{font-size:.84rem;font-weight:700;}
.daily-cnt b{font-family:'Orbitron',monospace;color:var(--a);}

.prog-track{height:8px;background:var(--bg3);border-radius:100px;overflow:hidden;}
.prog-fill{
  height:100%;border-radius:100px;min-width:3px;
  background:linear-gradient(90deg,#74d400,#bfff00,#e0ff66);
  box-shadow:0 0 10px var(--a-glo);
  transition:width .55s cubic-bezier(.34,1.56,.64,1);
}
.daily-bot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:9px;
}
.daily-hint{font-size:.72rem;color:var(--mu);}
.cheat-btn{
  padding:3px 9px;font-size:.68rem;font-weight:700;
  background:transparent;border:1px solid var(--bd);border-radius:6px;
  color:var(--mu);cursor:pointer;font-family:'Rajdhani',sans-serif;
  transition:all .2s;letter-spacing:.2px;
}
.cheat-btn:hover{border-color:var(--a);color:var(--a);}

/* Score OK button */
.score-ok{
  display:block;width:100%;margin-top:12px;padding:9px 0;
  background:var(--a-dim);border:1px solid var(--a-brd);border-radius:8px;
  color:var(--a);font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .2s;
}
.score-ok:hover{background:var(--a);color:#000;box-shadow:0 0 14px var(--a-glo);}
.score-ok-hint{
  font-size:.72rem;color:var(--mu);margin-top:7px;text-align:center;
  font-family:'Share Tech Mono',monospace;letter-spacing:.3px;
}

/* ═══════════════════════════════════════════════════════════════
   SEARCH + FILTERS
   ═══════════════════════════════════════════════════════════════ */
.search-row{display:flex;gap:10px;margin:22px 0 12px;}
.s-wrap{position:relative;flex:1;}
.s-ico{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--mu);font-size:.95rem;pointer-events:none;
  font-family:'Share Tech Mono',monospace;
}
.s-in{
  width:100%;padding:10px 36px 10px 38px;min-height:44px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  color:var(--tx);font-size:.93rem;font-family:'Rajdhani',sans-serif;
  outline:none;transition:border-color .2s;
}
.s-in:focus{border-color:var(--a-brd);}
.s-in::placeholder{color:var(--mu);}
.s-clr{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--mu);cursor:pointer;
  font-size:1rem;line-height:1;padding:2px;display:none;
  transition:color .2s;
}
.s-clr.vis{display:block;}
.s-clr:hover{color:var(--tx);}

/* Category filter pills */
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.cat-btn{
  padding:5px 13px;min-height:34px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:100px;
  color:var(--mu);font-family:'Rajdhani',sans-serif;font-size:.76rem;font-weight:700;
  cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.2px;
}
.cat-btn:hover:not(.on){border-color:rgba(255,255,255,.14);color:var(--tx);}
.cat-btn.on{background:var(--a-dim);border-color:var(--a-brd);color:var(--a);}

.res-count{font-size:.74rem;color:var(--mu);margin-bottom:14px;font-family:'Share Tech Mono',monospace;}

/* ═══════════════════════════════════════════════════════════════
   TOPIC GRID
   ═══════════════════════════════════════════════════════════════ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:12px;
}

/* ── Card ── */
.card{
  position:relative;overflow:hidden;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:18px 18px 16px;
  display:flex;flex-direction:column;gap:11px;
  transition:border-color .22s,box-shadow .22s,transform .22s;
}
/* Ambient gradient on idle */
.card::before{
  content:'';position:absolute;inset:0;border-radius:var(--r2);
  background:linear-gradient(130deg,var(--a-dim),transparent 60%);
  opacity:0;transition:opacity .25s;pointer-events:none;
}
/* Slow scan-line */
.card.c-on::after{
  content:'';position:absolute;left:0;right:0;top:-100%;height:50%;
  background:linear-gradient(to bottom,transparent,rgba(191,255,0,0.025),transparent);
  animation:scan 4s linear infinite;pointer-events:none;
}
@keyframes scan{to{top:200%;}}

.card.c-on{cursor:pointer;}
.card.c-on:hover{
  border-color:var(--a);transform:translateY(-2px);
  box-shadow:0 0 0 1px var(--a),0 10px 36px rgba(0,0,0,.45),0 0 24px var(--a-dim);
}
.card.c-on:hover::before{opacity:1;}
.card.c-off{opacity:.38;cursor:not-allowed;pointer-events:none;}

/* Card internals */
.card-top{display:flex;justify-content:space-between;align-items:center;}
.card-num{
  font-family:'Share Tech Mono',monospace;font-size:.68rem;
  color:var(--mu);letter-spacing:1px;
}
.bdg{
  padding:2px 8px;border-radius:100px;
  font-family:'Rajdhani',sans-serif;font-size:.63rem;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
}
.bdg-on  {background:var(--a-dim);color:var(--a);border:1px solid var(--a-brd);}
.bdg-off {background:rgba(255,255,255,.04);color:var(--mu);border:1px solid var(--bd);}

.card-title{
  font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;
  line-height:1.45;flex:1;
}
.c-on .card-title{color:var(--tx);}
.c-off .card-title{color:var(--mu);}

.card-bot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.cat-tag{
  padding:3px 9px;border-radius:6px;
  background:var(--bg3);border:1px solid var(--bd);
  color:var(--mu);font-size:.68rem;font-weight:600;
  max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card-cta{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 12px;border-radius:8px;
  background:var(--a-dim);border:1px solid var(--a-brd);
  color:var(--a);font-size:.74rem;font-weight:700;
  font-family:'Rajdhani',sans-serif;
  transition:background .2s,color .2s;white-space:nowrap;
}
.c-on:hover .card-cta{background:var(--a);color:#000;border-color:var(--a);}
.card-lock{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--mu);font-size:.7rem;font-weight:600;
}

/* Empty state */
.empty{
  grid-column:1/-1;text-align:center;padding:56px 20px;
}
.empty-ico{font-size:2.2rem;opacity:.35;margin-bottom:10px;}
.empty-txt{color:var(--mu);font-size:.92rem;}

/* ═══════════════════════════════════════════════════════════════
   EXAM COUNTDOWN
   ═══════════════════════════════════════════════════════════════ */
.countdown{
  margin:16px 0;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:16px 20px;
}
.countdown-lbl{
  font-family:'Share Tech Mono',monospace;font-size:.7rem;
  letter-spacing:2px;color:var(--a);font-weight:700;margin-bottom:10px;
}
.countdown-row{display:flex;gap:10px;flex-wrap:wrap;}
.countdown-unit{
  flex:1;min-width:60px;text-align:center;
  background:var(--bg3);border-radius:10px;padding:8px 4px;
}
.countdown-num{
  font-family:'Orbitron',monospace;font-weight:900;font-size:1.4rem;
  color:var(--a);line-height:1;display:block;
}
.countdown-unit-lbl{font-size:.62rem;color:var(--mu);letter-spacing:.5px;text-transform:uppercase;}

/* ═══════════════════════════════════════════════════════════════
   LEADERBOARD
   ═══════════════════════════════════════════════════════════════ */
.lboard{
  margin:16px 0;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:16px 20px;
}
.lboard-top{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;flex-wrap:wrap;gap:6px;
}
.lboard-lbl{
  font-family:'Share Tech Mono',monospace;font-size:.7rem;
  letter-spacing:2px;color:var(--a);font-weight:700;
}
.lboard-period{font-size:.68rem;color:var(--mu);}
.lboard-list{display:flex;flex-direction:column;gap:6px;}
.lboard-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.02);border:1px solid transparent;
  transition:background .2s,border-color .2s;
}
.lboard-row.me{
  background:var(--a-dim);border-color:var(--a-brd);
}
.lboard-rank{
  font-family:'Orbitron',monospace;font-weight:900;font-size:.9rem;
  color:var(--mu);width:26px;text-align:center;flex-shrink:0;
}
.lboard-row:nth-child(1) .lboard-rank{color:#ffd700;}
.lboard-row:nth-child(2) .lboard-rank{color:#c0c0c0;}
.lboard-row:nth-child(3) .lboard-rank{color:#cd7f32;}
.lboard-name{flex:1;font-size:.83rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lboard-row.me .lboard-name{color:var(--a);}
.lboard-count{
  font-family:'Orbitron',monospace;font-weight:700;font-size:.8rem;
  color:var(--a);flex-shrink:0;
}
.lboard-sep{
  text-align:center;color:var(--mu);font-size:.7rem;padding:2px 0;letter-spacing:2px;
}
.lboard-empty{text-align:center;color:var(--mu);font-size:.8rem;padding:16px 0;}
.lboard-badge{
  font-family:'Share Tech Mono',monospace;font-size:.58rem;font-weight:700;
  letter-spacing:.5px;padding:2px 7px;border-radius:100px;flex-shrink:0;
  background:linear-gradient(90deg,#ffd700,#ffed4e);color:#3a2a00;
  text-transform:uppercase;
}
.lboard-myrank{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--a-dim);border:1px solid var(--a-brd);border-radius:10px;
  padding:10px 14px;margin-bottom:12px;
}
.lboard-myrank-lbl{font-size:.72rem;color:var(--mu);}
.lboard-myrank-val{
  font-family:'Orbitron',monospace;font-weight:900;font-size:1.1rem;color:var(--a);
}
.lboard-myrank-val span{font-size:.7rem;font-weight:600;color:var(--mu);}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */
@media(max-width:640px){
  .page{padding:0 12px 60px;}
  header{padding:0 12px;}
  .hero-h{font-size:1.25rem;}
  .score-val{font-size:1.7rem;}
  .grid{grid-template-columns:1fr;}
  .h-mid{gap:7px;}
}
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header>
  <div class="h-logo">OL<em>·</em>MAT</div>

  <div class="h-mid">
    <!-- Streak -->
    <div class="streak">
      <span class="s-fire off" id="fireIcon">🔥</span>
      <span class="s-num"    id="streakNum">0</span>
    </div>
    <!-- Lang -->
    <div class="lsw">
      <button class="lbtn on" data-lang="lv">LV</button>
      <button class="lbtn"    data-lang="ru">RU</button>
      <button class="lbtn"    data-lang="en">EN</button>
    </div>
  </div>

  <a href="#" class="btn-back" id="backBtn" onclick="handleLogout(event)">
    ← <span class="btn-lbl" id="backLbl">Uz galveno izvēlni</span>
  </a>
</header>

<!-- ═══════════ PAGE ═══════════ -->
<div class="page">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-eye" id="eyebrow">VISC CE · OPTIMĀLAIS LĪMENIS</div>
    <h1 class="hero-h"><em id="heroTitleAcc">Izvēlies</em> <span id="heroTitleRest">tēmu</span></h1>

    <!-- Score slider -->
    <div class="score-box">
      <div class="score-row">
        <span class="score-lbl" id="scoreLbl">Mans CE mērķis</span>
        <span class="score-val" id="scoreVal">90%</span>
      </div>
      <input type="range" id="scoreSlider" min="40" max="100" value="90" step="5"/>
      <div class="score-hint" id="scoreHint">Tiek ieteikts apgūt visas aktīvās tēmas</div>
      <button class="score-ok" id="scoreOkBtn">OK</button>
      <div class="score-ok-hint" id="scoreOkHint"></div>
    </div>
  </div>

  <!-- DAILY GOAL -->
  <div class="daily">
    <div class="daily-top">
      <span class="daily-lbl" id="goalLbl">DIENAS MĒRĶIS</span>
      <span class="daily-cnt">
        <b id="doneNum">0</b>&nbsp;/&nbsp;<b id="goalNum">15</b>
        <span id="taskWrd"> uzdevumi</span>
      </span>
    </div>
    <div class="prog-track">
      <div class="prog-fill" id="progFill" style="width:0%"></div>
    </div>
    <div class="daily-bot">
      <span class="daily-hint" id="goalHint"></span>
      <button class="cheat-btn" id="cheatBtn" title="Dev: simulē +1 uzdevumu" style="display:none">＋ TEST</button>
    </div>
  </div>

  <!-- EXAM COUNTDOWN -->
  <div class="countdown">
    <div class="countdown-lbl" id="countdownLbl">LĪDZ EKSĀMENAM</div>
    <div class="countdown-row">
      <div class="countdown-unit">
        <span class="countdown-num" id="cdDays">--</span>
        <span class="countdown-unit-lbl" id="cdDaysLbl">dienas</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-num" id="cdHours">--</span>
        <span class="countdown-unit-lbl" id="cdHoursLbl">stundas</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-num" id="cdMinutes">--</span>
        <span class="countdown-unit-lbl" id="cdMinutesLbl">minūtes</span>

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 4 — LAIKS UN STRIKS
   ════════════════════════════════════════════════════════════
   DROŠĪBA pret laika manipulācijām:
   Latvijas datums tiek noteikts TIKAI ar Intl.DateTimeFormat
   { timeZone: "Europe/Riga" }. Sistēmas pulksteņa maiņa
   neietekmē rezultātu — tas ir atkarīgs no servera UTC laika
   un IANA laika joslas datu bāzes pārlūkprogrammā.
   ──────────────────────────────────────────────────────────── */

/** Atgriež šodienas datumu Latvijas laikā "YYYY-MM-DD" formātā */
function getRigaDate() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Riga",
    year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
}

function loadAppData() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; }
}
function saveAppData(d) {
  localStorage.setItem(LS_KEY, JSON.stringify(d));
}

/**
 * Inicializē / migrē datus.
 * Ja jaunā diena (Rīgas laika) — pārbauda, vai striks tika nopelnīts,
 * un atiestata dienas skaitītāju.
 */
function initAppData() {
  const today = getRigaDate();
  let d = loadAppData();
  if (!d) {
    d = { date: today, count: 0, streak: 0, score: 90 };
    saveAppData(d);
    DAILY_GOAL = scoreToGoal(90);
    return d;
  }
  DAILY_GOAL = scoreToGoal(d.score || 90);
  if (d.date !== today) {
    const minOk = Math.max(2, Math.floor(DAILY_GOAL * STREAK_MIN_PCT));
    d.streak = (d.count >= minOk) ? (d.streak || 0) + 1 : 0;
    d.date   = today;
    d.count  = 0;
    saveAppData(d);
  }
  return d;
}

let AD = initAppData(); // application data

/** Pievieno 1 uzdevumu, saglabā, atjauno UI */
function addTask() {
  AD.count++;
  saveAppData(AD);
  renderStreak();
  renderProgress();
}

/** Atjaunina liesmas ikonu un striku skaitītāju */
function renderStreak() {
  const minOk = Math.max(2, Math.floor(DAILY_GOAL * STREAK_MIN_PCT));
  const on    = AD.count >= minOk;
  document.getElementById("fireIcon").className = "s-fire " + (on ? "on" : "off");
  document.getElementById("streakNum").textContent = AD.streak;
}

/** Atjaunina dienas mērķa joslu un tekstu */
function renderProgress() {
  const pct = Math.min(100, (AD.count / DAILY_GOAL) * 100);
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("doneNum").textContent  = AD.count;
  document.getElementById("goalNum").textContent  = DAILY_GOAL;
  document.getElementById("taskWrd").textContent  = tx("taskWrd");
  document.getElementById("goalHint").textContent =
    tx("goalHint").replace("${G}", DAILY_GOAL);
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 4B — EKSĀMENA ATSKAITE (COUNTDOWN)
   ════════════════════════════════════════════════════════════
   Mērķa datums: 2026. gada 30. septembris, 00:00 pēc Rīgas laika.
   Tīri klienta puses aprēķins, bez servera pieprasījumiem —
   atjaunojas katru sekundi.
   ──────────────────────────────────────────────────────────── */

var EXAM_DATE = new Date("2026-09-30T00:00:00+03:00"); // Rīgas laika josla (EEST)

function updateCountdown() {
  var now = new Date();
  var diff = EXAM_DATE - now;

  if (diff <= 0) {
    document.getElementById("cdDays").textContent = "0";
    document.getElementById("cdHours").textContent = "0";
    document.getElementById("cdMinutes").textContent = "0";
    document.getElementById("cdSeconds").textContent = "0";
    return;
  }

  var days = Math.floor(diff / (1000 * 60 * 60 * 24));
  var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((diff % (1000 * 60)) / 1000);

  document.getElementById("cdDays").textContent = days;
  document.getElementById("cdHours").textContent = hours;
  document.getElementById("cdMinutes").textContent = minutes;
  document.getElementById("cdSeconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 4C — LĪDERU SARAKSTS (LEADERBOARD)
   ════════════════════════════════════════════════════════════
   Iegūst datus no /leaderboard endpoint. Tā kā auth.js jau
   pārbaudīja tokenu (citādi šī lapa vispār neielādētos),
   izmantojam to pašu WORKER_URL un token, kas jau ir localStorage.
   ──────────────────────────────────────────────────────────── */

var LBOARD_WORKER_URL = "https://floral-tree-d2cb.eusjs56999.workers.dev/";

async function loadLeaderboard() {
  var listEl = document.getElementById("lboardList");
  var myRankBox = document.getElementById("lboardMyRank");
  var token = localStorage.getItem("session_token");
  if (!token) return; // auth.js jau būtu novirzījis uz login, bet drošības pēc

  try {
    var res = await fetch(LBOARD_WORKER_URL + "leaderboard", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({})
    });
    var data = await res.json();

    if (!res.ok || !data.top) {
      listEl.innerHTML = '<div class="lboard-empty">Neizdevās ielādēt.</div>';
      return;
    }

    if (data.top.length === 0) {
      listEl.innerHTML = '<div class="lboard-empty">Vēl nav datu.</div>';
      return;
    }

    // Vienmēr rādām "tava vieta" bloku virs saraksta — neatkarīgi no tā,
    // vai lietotājs ir topā vai nav
    if (data.myRank > 0) {
      myRankBox.style.display = "flex";
      document.getElementById("lboardMyRankVal").innerHTML =
        "#" + data.myRank + ' <span id="lboardMyRankOf">' + tx("lboardOf") + " " + data.totalUsers + "</span>";
    }

    var html = "";
    var myShown = false;

    data.top.forEach(function(u, idx) {
      var rank = idx + 1;
      var isMe = (u.username === data.myUsername);
      if (isMe) myShown = true;
      var medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
      var badge = rank <= 3 ? '<span class="lboard-badge">' + tx("lboardBadge") + '</span>' : '';
      html += '<div class="lboard-row' + (isMe ? ' me' : '') + '">' +
        '<span class="lboard-rank">' + medal + '</span>' +
        '<span class="lboard-name">' + escapeHtml(u.displayName || u.username) + '</span>' +
        badge +
        '<span class="lboard-count">' + u.solvedCount + '</span>' +
        '</div>';
    });

    // Ja lietotājs nav topā, parādām atsevišķi viņa pozīciju sarakstā
    if (!myShown && data.myRank > 0) {
      html += '<div class="lboard-sep">···</div>';
      html += '<div class="lboard-row me">' +
        '<span class="lboard-rank">' + data.myRank + '</span>' +
        '<span class="lboard-name">' + escapeHtml(data.myUsername) + '</span>' +
        '<span class="lboard-count">—</span>' +
        '</div>';
    }

    listEl.innerHTML = html;
  } catch(e) {
    listEl.innerHTML = '<div class="lboard-empty">Neizdevās ielādēt.</div>';
  }
}

function escapeHtml(str) {
  return String(str).replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

loadLeaderboard();

   █  SEKCIJA 5 — GITHUB MARŠRUTĒŠANA
   ════════════════════════════════════════════════════════════
   Katrā tēmā ir github_folder. Kad lietotājs noklikšķina uz
   aktīvas kartītes, viņš tiek novirzīts uz:
     PRACTICE_PAGE?topic=<github_folder>
   practice.html pats pieprasa failus no:
     GITHUB_BASE_URL + github_folder + "/..."
   ──────────────────────────────────────────────────────────── */
function getTopicUrl(topic) {
  return PRACTICE_PAGE + "?topic=" + encodeURIComponent(topic.github_folder);
}
function goToTopic(topic) {
  if (!topic.isActive) return;
  window.location.href = getTopicUrl(topic);
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 6 — MEKLĒŠANAS LOĢIKA  (fuzzy-style)
   ════════════════════════════════════════════════════════════
   Meklēšana notiek pret VISIEM tēmas laukiem:
     • nosaukums visās valodās
     • kategorija visās valodās
     • tags masīvs (daudzvalodu sinonīmi)
   Vaicājums tiek sadalīts atstarpes-tokenī.
   Tēma tiek rādīta, ja VISI tokeni atrasti kaut kur
   norādītajos laukos (case-insensitive substring match).
   Piemērs: "дискриминант" → atrod topic_10 caur tags[].
   ──────────────────────────────────────────────────────────── */
let searchQ  = "";
let filterCat = null; // null = visas

function topicMatch(topic, q) {
  if (!q) return true;
  const tokens = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const hay = [
    topic.title.lv, topic.title.ru, topic.title.en,
    topic.category.lv, topic.category.ru, topic.category.en,
    ...topic.tags
  ].join(" ").toLowerCase();
  return tokens.every(tok => hay.includes(tok));
}

function filtered() {
  return TOPICS.filter(tp => {
    const ms = topicMatch(tp, searchQ);
    const mc = !filterCat || tp.category.lv === filterCat;
    return ms && mc;
  });
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 7 — RENDERĒŠANA
   ════════════════════════════════════════════════════════════ */

/** Kategoriju filtru pogas */
function renderCats() {
  const seen = new Set();
  const cats = [];
  TOPICS.forEach(tp => {
    if (!seen.has(tp.category.lv)) { seen.add(tp.category.lv); cats.push(tp.category); }
  });
  const wrap = document.getElementById("catFilters");
  let h = `<button class="cat-btn on" data-c="">${tx("catAll")}</button>`;
  cats.forEach(c => {
    h += `<button class="cat-btn" data-c="${c.lv}">${c[lang]||c.lv}</button>`;
  });
  wrap.innerHTML = h;
  wrap.querySelectorAll(".cat-btn").forEach(b => {
    b.addEventListener("click", () => {
      wrap.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      filterCat = b.dataset.c || null;
      renderGrid();
    });
  });
}

/** Tēmu kartīšu režģis */
function renderGrid() {
  const list = filtered();
  const grid = document.getElementById("topicGrid");
  const resCnt = document.getElementById("resCnt");
  resCnt.textContent = list.length < TOPICS.length
    ? tx("resTpl").replace("{n}", list.length)
    : "";

  if (!list.length) {
    grid.innerHTML =
      `<div class="empty"><div class="empty-ico">🔍</div>` +
      `<div class="empty-txt">${tx("empty")}</div></div>`;
    return;
  }

  grid.innerHTML = list.map(tp => {
    const num   = tp.id.split("_")[1];
    const title = tp.title[lang] || tp.title.lv;
    const cat   = tp.category[lang] || tp.category.lv;
    const on    = tp.isActive;
    const badge = on
      ? `<span class="bdg bdg-on">${tx("bdgOn")}</span>`
      : `<span class="bdg bdg-off">${tx("bdgOff")}</span>`;
    const action = on
      ? `<span class="card-cta">${tx("cta")}</span>`
      : `<span class="card-lock">🔒 ${tx("lock")}</span>`;

    return `<div class="card ${on?"c-on":"c-off"}"
              data-id="${tp.id}" ${on?'role="button" tabindex="0"':""}>
      <div class="card-top">
        ${badge}
        <span class="card-num"># ${num}</span>
      </div>
      <div class="card-title">${title}</div>
      <div class="card-bot">
        <span class="cat-tag">${cat}</span>
        ${action}
      </div>
    </div>`;
  }).join("");

  /* Klikšķu apstrādātāji */
  grid.querySelectorAll(".c-on").forEach(el => {
    const id = el.dataset.id;
    const tp = TOPICS.find(x => x.id === id);
    el.addEventListener("click", () => goToTopic(tp));
    el.addEventListener("keydown", e => { if (e.key==="Enter") goToTopic(tp); });
  });
}

  renderGrid();
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 8 — SCORE SLIDERS
   ════════════════════════════════════════════════════════════ */
function initSlider() {
  const sl     = document.getElementById("scoreSlider");
  const dv     = document.getElementById("scoreVal");
  const okBtn  = document.getElementById("scoreOkBtn");
  const okHint = document.getElementById("scoreOkHint");

  sl.value = AD.score || 90;

  const updPreview = () => {
    const v = parseInt(sl.value);
    dv.textContent = v + "%";
    const p = ((v - 40) / 60 * 100).toFixed(1) + "%";
    sl.style.setProperty("--p", p);
    okHint.textContent = "→ " + scoreToGoal(v) + " " + tx("perDay");
  };

  const applyGoal = () => {
    const v    = parseInt(sl.value);
    AD.score   = v;
    DAILY_GOAL = scoreToGoal(v);
    saveAppData(AD);
    renderProgress();
    renderStreak();
    /* Визуальное подтверждение */
    okBtn.textContent = "✓";
    setTimeout(() => { okBtn.textContent = "OK"; }, 900);
  };

  updPreview();
  sl.addEventListener("input", updPreview);
  okBtn.addEventListener("click", applyGoal);
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 9 — VALODAS PĀRSLĒDZĒJS
   ════════════════════════════════════════════════════════════ */
function initLang() {
  document.querySelectorAll(".lbtn").forEach(b => {
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      document.querySelectorAll(".lbtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      document.documentElement.lang = lang;
      renderAll();
    });
  });
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 10 — MEKLĒŠANAS LAUKS
   ════════════════════════════════════════════════════════════ */
function initSearch() {
  const inp = document.getElementById("searchInput");
  const clr = document.getElementById("searchClear");
  inp.addEventListener("input", () => {
    searchQ = inp.value;
    clr.classList.toggle("vis", !!searchQ);
    renderGrid();
  });
  clr.addEventListener("click", () => {
    inp.value = searchQ = "";
    clr.classList.remove("vis");
    inp.focus(); renderGrid();
  });
}

/* ════════════════════════════════════════════════════════════
   █  SEKCIJA 12 — IZIET NO KONTA (LOGOUT)
   ════════════════════════════════════════════════════════════
   Tiek izsaukts, kad lietotājs nospiež "Uz galveno izvēlni".
   Mēģina izsaukt auth.js logout funkciju, pēc tam pāriet uz /.
   ──────────────────────────────────────────────────────────── */
async function handleLogout(e) {
  if (e) e.preventDefault();
  try {
    if      (typeof window.logout    === "function") await window.logout();
    else if (typeof window.signOut   === "function") await window.signOut();
    else if (window.firebase?.auth)                  await window.firebase.auth().signOut();
  } catch (err) { console.warn("Logout:", err); }
  window.location.href = "/main/";
}

/* Auto-atjauninājums, ja practice.html maina localStorage
   (uzdevumu skaits tiek ņemts automātiski bez pogas)        */
window.addEventListener("storage", (e) => {
  if (e.key === LS_KEY) {
    const fresh = loadAppData();
    if (fresh) { AD = fresh; renderProgress(); renderStreak(); }
  }
});

/* ════════════════════════════════════════════════════════════
   █  INICIALIZĀCIJA
   ════════════════════════════════════════════════════════════ */
(function init() {
  initLang();
  initSlider();
  initSearch();
  initCheat();
  renderAll();
})();
