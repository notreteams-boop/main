<!DOCTYPE html>
<html lang="lv">
<head>
<!-- !! DROŠĪBA: auth.js — OBLIGĀTI PIRMĀ RINDA !! -->
<script src="/main/auth.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mans konts · OL Mat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:    #07010f;
  --bg2:   #161820;
  --bg3:   #1e2028;
  --bg4:   #232635;
  --bd:    rgba(255,255,255,0.07);
  --a:     #bfff00;
  --a-dim: rgba(191,255,0,0.09);
  --a-glo: rgba(191,255,0,0.28);
  --a-brd: rgba(191,255,0,0.26);
  --tx:    #e8eaf0;
  --mu:    rgba(232,234,240,0.44);
  --or:    #ff8800;
  --re:    #ff3b3b;
  --r:     12px;
  --r2:    16px;
}
html{scroll-behavior:smooth;}
body{
  color:var(--tx);
  font-family:'Rajdhani',sans-serif;font-size:16px;
  min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 2% -5%,  rgba(200,20,255,0.09),  transparent),
    radial-gradient(ellipse 60% 50% at 98% 102%, rgba(15,60,255,0.08),  transparent),
    linear-gradient(175deg, #21093B 0%, #100320 45%, #07010f 100%);
  background-attachment:fixed;
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--a-brd);}

header{
  position:sticky;top:0;z-index:200;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;gap:16px;
  background:rgba(20,5,40,0.88);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--a-brd);
}
.h-logo{
  font-family:'Orbitron',monospace;font-weight:900;font-size:1rem;
  letter-spacing:3px;color:var(--a);text-shadow:0 0 18px var(--a-glo);flex-shrink:0;
}
.h-logo em{color:var(--tx);font-style:normal;}
.btn-back{
  display:flex;align-items:center;gap:5px;
  background:transparent;border:1px solid var(--a-brd);color:var(--a);
  font-family:inherit;font-size:.8rem;font-weight:700;text-decoration:none;
  padding:7px 15px;border-radius:100px;transition:.2s;flex-shrink:0;
}
.btn-back:hover{background:var(--a);color:#000;}
@media(max-width:540px){
  header{padding:0 12px;}
  .h-logo{font-size:.85rem;}
  .btn-back .btn-lbl{display:none;}
}

.page{max-width:820px;margin:0 auto;padding:0 24px 60px;}
.hero-eye{
  font-family:'Share Tech Mono',monospace;font-size:.7rem;
  letter-spacing:2.5px;text-transform:uppercase;color:var(--a);margin:28px 0 8px;
}
.hero-h{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(1.35rem,4.5vw,2rem);letter-spacing:1px;margin-bottom:8px;
}
.hero-h em{color:var(--a);font-style:normal;text-shadow:0 0 18px var(--a-glo);}
.hero-sub{color:var(--mu);font-size:.85rem;margin-bottom:24px;}

.saved-list{display:flex;flex-direction:column;gap:12px;}
.saved-item{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:18px;transition:border-color .2s;
}
.saved-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer;}
.saved-q{font-size:.9rem;line-height:1.5;flex:1;}
.saved-date{font-size:.68rem;color:var(--mu);white-space:nowrap;margin-top:2px;}
.saved-toggle{color:var(--a);font-size:1.1rem;flex-shrink:0;transition:transform .25s;}
.saved-item.open .saved-toggle{transform:rotate(45deg);}
.saved-body{overflow:hidden;max-height:0;transition:max-height .3s ease;}
.saved-item.open .saved-body{padding-top:14px;}
.saved-answer{
  background:var(--a-dim);border:1px solid var(--a-brd);border-radius:var(--r);
  padding:12px 14px;margin-bottom:10px;font-size:.85rem;
}
.saved-answer strong{color:var(--a);}
.saved-step{font-size:.8rem;color:var(--mu);line-height:1.6;margin-bottom:6px;padding-left:14px;position:relative;}
.saved-step::before{content:"•";color:var(--a);position:absolute;left:0;}
.saved-actions{display:flex;justify-content:flex-end;margin-top:10px;}
.saved-del{
  background:transparent;border:1px solid var(--re);color:var(--re);
  border-radius:var(--r);padding:7px 14px;font-size:.78rem;font-weight:600;
  cursor:pointer;transition:.2s;font-family:inherit;
}
.saved-del:hover{background:var(--re);color:#fff;}

.empty-state{text-align:center;padding:60px 20px;color:var(--mu);}
.empty-state-icon{font-size:2.5rem;margin-bottom:12px;opacity:.5;}
.loading-state{text-align:center;padding:60px 20px;color:var(--mu);font-size:.9rem;}

@media(max-width:640px){
  .page{padding:0 12px 60px;}
  .hero-h{font-size:1.25rem;}
}
</style>
</head>
<body>

<header>
  <div class="h-logo">OL<em>·</em>MAT</div>
  <a href="/main/menu.html" class="btn-back">
    ← <span class="btn-lbl" id="backLbl">Uz tēmām</span>
  </a>
</header>

<div class="page">
  <div class="hero-eye" id="eyebrow">MANS KONTS</div>
  <h1 class="hero-h"><em id="heroAcc">Saglabātie</em> <span id="heroRest">uzdevumi</span></h1>
  <div class="hero-sub" id="heroSub">Uzdevumi, kurus saglabāji, lai vēlāk atkārtotu</div>

  <div class="saved-list" id="savedList">
    <div class="loading-state" id="loadingState">Ielādē...</div>
  </div>
</div>

<script>
"use strict";

const WORKER_URL = "https://floral-tree-d2cb.eusjs56999.workers.dev/";

const I18N = {
  lv: {
    backLbl:"Uz tēmām", eyebrow:"MANS KONTS", heroAcc:"Saglabātie", heroRest:"uzdevumi",
    heroSub:"Uzdevumi, kurus saglabāji, lai vēlāk atkārtotu",
    emptyTitle:"Nav saglabātu uzdevumu", emptyHint:"Saglabā uzdevumus, risinot tos — tie parādīsies šeit.",
    answer:"Atbilde", delBtn:"Dzēst", loading:"Ielādē...", errLoad:"Neizdevās ielādēt.", delConfirm:"Tiešām dzēst šo uzdevumu?"
  },
  ru: {
    backLbl:"К темам", eyebrow:"МОЙ КАБИНЕТ", heroAcc:"Сохранённые", heroRest:"задания",
    heroSub:"Задания, которые ты сохранил, чтобы повторить позже",
    emptyTitle:"Нет сохранённых заданий", emptyHint:"Сохраняй задания при решении — они появятся здесь.",
    answer:"Ответ", delBtn:"Удалить", loading:"Загружаю...", errLoad:"Не удалось загрузить.", delConfirm:"Точно удалить это задание?"
  },
  en: {
    backLbl:"To topics", eyebrow:"MY ACCOUNT", heroAcc:"Saved", heroRest:"tasks",
    heroSub:"Tasks you saved to review later",
    emptyTitle:"No saved tasks yet", emptyHint:"Save tasks while solving them — they'll appear here.",
    answer:"Answer", delBtn:"Delete", loading:"Loading...", errLoad:"Failed to load.", delConfirm:"Really delete this task?"
  }
};

let lang = "lv";
const tx = k => I18N[lang][k] ?? k;

function escapeHtml(str) {
  return String(str).replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function formatDate(ts) {
  return new Date(ts).toLocaleDateString(lang === "ru" ? "ru-RU" : (lang === "en" ? "en-GB" : "lv-LV"), {
    day: "2-digit", month: "2-digit", year: "numeric"
  });
}

async function loadSavedTasks() {
  var token = localStorage.getItem("session_token");
  if (!token) return;

  var listEl = document.getElementById("savedList");

  try {
    var res = await fetch(WORKER_URL + "get-saved-tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({})
    });
    var data = await res.json();

    if (!res.ok || !data.tasks) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>' + tx("errLoad") + '</div>';
      return;
    }

    if (data.tasks.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>' +
        '<div>' + tx("emptyTitle") + '</div>' +
        '<div style="font-size:.8rem;margin-top:6px;">' + tx("emptyHint") + '</div></div>';
      return;
    }

    var html = "";
    data.tasks.forEach(function(t) {
      var stepsHtml = (t.steps || []).map(function(s) {
        return '<div class="saved-step">' + escapeHtml(s) + '</div>';
      }).join("");

      html += '<div class="saved-item" data-id="' + escapeHtml(t.id) + '">' +
        '<div class="saved-top">' +
          '<div class="saved-q">' + escapeHtml(t.question) +
            '<div class="saved-date">' + formatDate(t.savedAt) + '</div>' +
          '</div>' +
          '<span class="saved-toggle">+</span>' +
        '</div>' +
        '<div class="saved-body">' +
          '<div class="saved-answer"><strong>' + tx("answer") + ':</strong> ' + escapeHtml(t.answer) + '</div>' +
          stepsHtml +
          '<div class="saved-actions"><button class="saved-del">' + tx("delBtn") + '</button></div>' +
        '</div>' +
      '</div>';
    });

    listEl.innerHTML = html;
    attachHandlers();
  } catch(e) {
    listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>' + tx("errLoad") + '</div>';
  }
}

function attachHandlers() {
  document.querySelectorAll(".saved-item").forEach(function(item) {
    var top = item.querySelector(".saved-top");
    var body = item.querySelector(".saved-body");

    top.addEventListener("click", function() {
      var open = item.classList.contains("open");
      if (open) {
        item.classList.remove("open");
        body.style.maxHeight = "0";
      } else {
        item.classList.add("open");
        body.style.maxHeight = body.scrollHeight + "px";
      }
    });

    var delBtn = item.querySelector(".saved-del");
    delBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      deleteSavedTask(item.dataset.id, item);
    });
  });
}

async function deleteSavedTask(id, itemEl) {
  if (!confirm(tx("delConfirm"))) return;

  var token = localStorage.getItem("session_token");
  try {
    var res = await fetch(WORKER_URL + "delete-saved-task", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ id: id })
    });
    if (res.ok) {
      itemEl.remove();
      // Если список опустел — показываем empty state
      if (document.querySelectorAll(".saved-item").length === 0) {
        loadSavedTasks();
      }
    }
  } catch(e) {
    // Тихо игнорируем — пользователь может попробовать снова
  }
}

function applyLang(l) {
  lang = l;
  document.getElementById("backLbl").textContent = tx("backLbl");
  document.getElementById("eyebrow").textContent = tx("eyebrow");
  document.getElementById("heroAcc").textContent = tx("heroAcc");
  document.getElementById("heroRest").textContent = tx("heroRest");
  document.getElementById("heroSub").textContent = tx("heroSub");
}

loadSavedTasks();

</script>

</body>
</html>
