<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ieiet – OL Mat Sagatavošana</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f4d5bb; color: #000; font-family: Arial, Helvetica, sans-serif; font-size: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; padding: 40px 36px; max-width: 380px; width: 100%; }
  h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
  .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 0.82rem; margin-bottom: 6px; color: #444; }
  input { width: 100%; border: none; border-bottom: 1.5px solid #999; padding: 6px 4px; font-size: 1rem; font-family: Arial, sans-serif; background: transparent; outline: none; }
  input:focus { border-bottom-color: #000; }
  .btn { width: 100%; padding: 10px; border: 1.5px solid #000; background: #000; color: #fff; font-size: 0.95rem; font-family: Arial, sans-serif; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #333; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .error { color: #b81c1c; font-size: 0.82rem; margin-top: 14px; display: none; }
  .expired { background: #fff3cd; border: 1px solid #ffc107; color: #7a5600; padding: 10px 14px; font-size: 0.82rem; margin-bottom: 18px; display: none; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #aaa; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-left: 7px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>OL Mat Sagatavošana</h1>
  <div class="subtitle">11. klase · Ieiet savā kontā</div>

  <div class="expired" id="expired-msg">Abonements beidzies vai sesija nav derīga. Raksti Telegram.</div>

  <div class="field">
    <label>Lietotājvārds</label>
    <input type="text" id="username" autocomplete="username" autocapitalize="none" />
  </div>
  <div class="field">
    <label>Parole</label>
    <input type="password" id="password" autocomplete="current-password" />
  </div>

  <button class="btn" id="login-btn">Ieiet</button>
  <div class="error" id="error-msg"></div>
</div>

<script>
var WORKER_URL = "https://floral-tree-d2cb.eusjs56999.workers.dev/";

// Показать сообщение об истёкшей сессии
var params = new URLSearchParams(window.location.search);
if (params.get("expired") === "1") {
  document.getElementById("expired-msg").style.display = "block";
}

// Если уже залогинен — редирект на меню
if (localStorage.getItem("session_token")) {
  window.location.href = "/main/menu.html";
}

function showError(msg) {
  var e = document.getElementById("error-msg");
  e.textContent = msg;
  e.style.display = "block";
}

document.getElementById("login-btn").addEventListener("click", async function() {
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value.trim();

  if (!username || !password) {
    showError("Lūdzu, ievadi lietotājvārdu un paroli.");
    return;
  }

  var btn = document.getElementById("login-btn");
  btn.disabled = true;
  btn.innerHTML = "Ieiet<span class='spinner'></span>";
  document.getElementById("error-msg").style.display = "none";

  try {
    var res = await fetch(WORKER_URL + "login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    });

    var data = await res.json();

    if (!res.ok) {
      showError(data.error || "Kļūda. Mēģini vēlreiz.");
      btn.disabled = false;
      btn.innerHTML = "Ieiet";
      return;
    }

    localStorage.setItem("session_token", data.token);
    window.location.href = "/main/menu.html";

  } catch(e) {
    showError("Savienojuma kļūda. Pārbaudi internetu.");
    btn.disabled = false;
    btn.innerHTML = "Ieiet";
  }
});

// Enter для отправки
["username", "password"].forEach(function(id) {
  document.getElementById(id).addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });
});
</script>
</body>
</html>
